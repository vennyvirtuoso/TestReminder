<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IITB Placement Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e2e8f0;
    }
    .logo-badge {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      font-weight: 800;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }
    .subtitle {
      font-size: 11px;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      outline: none;
    }
    input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }
    .status-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .status-label {
      color: #64748b;
    }
    .status-val {
      font-weight: 600;
      color: #0f172a;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">IITB</div>
    <div>
      <div class="title">Placement Auto-Sync</div>
      <div class="subtitle">campus.placements.iitb.ac.in</div>
    </div>
  </div>

  <div class="form-group">
    <label for="vercelUrl">Your Vercel Web App URL</label>
    <input type="url" id="vercelUrl" placeholder="https://your-app.vercel.app" />
  </div>

  <div class="form-group">
    <label for="studentLdap">Your LDAP ID / Roll No</label>
    <input type="text" id="studentLdap" placeholder="e.g. 210050012 (auto-detected if empty)" />
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Active Tab:</span>
      <span class="status-val" id="portalStatus">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Scraped Companies:</span>
      <span class="status-val" id="companyCount">0</span>
    </div>
  </div>

  <button class="btn btn-primary" id="syncBtn">
    🚀 Scrape & Sync Now
  </button>

  <button class="btn btn-secondary" id="openAppBtn">
    Open Tracker Web App ↗
  </button>

  <p class="hint">
    Open the IIT Bombay Placement Portal (<a href="https://campus.placements.iitb.ac.in/applicant/application" target="_blank" style="color:#0284c7;">applicant/application</a>), then click Scrape & Sync.
  </p>

  <script src="popup.js"></script>
</body>
</html>
